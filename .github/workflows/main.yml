name: Auto Update EWS

on:
  schedule:
    - cron: '*/60 * * * *' 
  workflow_dispatch: 

jobs:
  update-data:
    runs-on: self-hosted
    steps:
      - name: Tarik kode dari repository
        uses: actions/checkout@v3

      - name: Siapkan Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instal Library
        run: pip install -r requirements.txt

      - name: Jalankan Skrip Unduh & Proses
        env:
          TZ: Asia/Jakarta
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: python -u proses_himawari_dan_log_cb.py

      - name: Simpan Data Baru ke GitHub
        run: |
          git config --global user.name 'Robot EWS'
          git config --global user.email 'robot@bmkg.go.id'
          git add .
          git commit -m "Auto-update data EWS" || echo "Tidak ada perubahan"
          git push
