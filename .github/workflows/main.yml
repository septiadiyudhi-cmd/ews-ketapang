name: Auto Update EWS

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: self-hosted
    steps:
      - name: Tarik kode dari repository
        uses: actions/checkout@v4

      - name: Jalankan Skrip Unduh & Proses
        env:
          TZ: Asia/Jakarta
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          RADAR_API_URL: ${{ secrets.RADAR_API_URL }}
          RADAR_REFERER: ${{ secrets.RADAR_REFERER }}
          AWS_GILIMANUK_URL: ${{ secrets.AWS_GILIMANUK_URL }}
          AWS_KETAPANG_URL: ${{ secrets.AWS_KETAPANG_URL }}
        run: C:/Users/anaconda/python.exe -u proses_himawari_dan_log_cb.py

      # --- TAMBAHKAN STEP INSTALASI INI ---
      - name: Jalankan Prediksi Nowcasting Radar
        run: C:/Users/anaconda/python.exe -u nowcasting_radar.py
        
      - name: Gambar Peta Nowcasting
        run: C:/Users/anaconda/python.exe -u plot_nowcasting.py
        
      - name: Jalankan Prediksi Nowcasting Satelit
        run: C:/Users/anaconda/python.exe -u nowcasting_satelit.py
      # ------------------------------------

      - name: Simpan Data Baru ke GitHub
        shell: bash
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Update otomatis data satelit dan radar" || echo "Tidak ada perubahan"
          git rebase --abort || true
          git pull --rebase origin main
          git push origin main
          } else {
              echo "Tidak ada perubahan"
          }
