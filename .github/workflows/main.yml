name: Auto Update EWS

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: self-hosted
    # Menjamin SEMUA perintah (termasuk Python) tereksekusi di dalam folder yang benar
    defaults:
      run:
        working-directory: C:\actions-runner\_work\ews-ketapang\ews-ketapang

    steps:
      # Lakukan pembersihan RAM dan proses secara paksa dari jarak jauh
      - name: Basmi Proses Menggantung (Remote Task Manager)
        run: |
          Stop-Process -Name "python" -Force -ErrorAction SilentlyContinue
          Stop-Process -Name "chrome" -Force -ErrorAction SilentlyContinue
          Stop-Process -Name "git" -Force -ErrorAction SilentlyContinue
        shell: powershell
        
      # Optimasi tingkat lanjut untuk internet tidak stabil dan file besar
      - name: Optimasi Jaringan Git (Anti Putus)
        run: |
          git config --global http.postBuffer 1048576000
          git config --global http.sslBackend openssl
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
          git config --global core.compression 0
          git config --global http.version HTTP/1.1
        shell: powershell

      - name: Siapkan Repositori (Tanpa Git Pull)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $env:GIT_TERMINAL_PROMPT="0"
          $env:GCM_INTERACTIVE="false"
          git config --global --add safe.directory C:\actions-runner\_work\ews-ketapang\ews-ketapang
          git remote set-url origin https://x-access-token:$env:GITHUB_TOKEN@github.com/septiadiyudhi-cmd/ews-ketapang.git
          
          # KITA MATIKAN SEMENTARA git pull karena data sudah utuh dari unduhan HP
          # git config pull.rebase false
          # git pull origin main --no-edit
        shell: powershell

      - name: Install Dependencies
        run: C:/Users/anaconda/python.exe -m pip install beautifulsoup4

      - name: Jalankan Skrip Unduh & Proses
        env:
          TZ: Asia/Jakarta
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          RADAR_API_URL: ${{ secrets.RADAR_API_URL }}
          RADAR_REFERER: ${{ secrets.RADAR_REFERER }}
          AWS_RAW_DATA_URL: ${{ secrets.AWS_RAW_DATA_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: C:/Users/anaconda/python.exe -u proses_himawari_dan_log_cb.py

      - name: Jalankan Prediksi Nowcasting Radar
        run: C:/Users/anaconda/python.exe -u nowcasting_radar.py
        
      - name: Gambar Peta Nowcasting
        run: C:/Users/anaconda/python.exe -u plot_nowcasting.py
        
      - name: Jalankan Prediksi Nowcasting Satelit
        run: C:/Users/anaconda/python.exe -u nowcasting_satelit.py

      - name: Simpan Data Baru ke GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Matikan semua pop-up login tersembunyi
          $env:GIT_TERMINAL_PROMPT="0"
          $env:GCM_INTERACTIVE="false"
          
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          
          # Hapus paksa folder rebase jika macet sebelumnya
          if (Test-Path ".git\rebase-merge") { Remove-Item -Recurse -Force ".git\rebase-merge" }
          
          # Lakukan commit, abaikan error jika tidak ada perubahan
          git commit -m "Update otomatis data satelit dan radar"
          $LASTEXITCODE = 0
          
          # Tarik pembaruan YAML dari GitHub agar tidak ditolak saat push
          git pull https://x-access-token:$env:GITHUB_TOKEN@github.com/septiadiyudhi-cmd/ews-ketapang.git main --no-rebase --no-edit
          
          # Dorong hasil akhirnya ke GitHub pakai token VIP
          git push https://x-access-token:$env:GITHUB_TOKEN@github.com/septiadiyudhi-cmd/ews-ketapang.git main
        shell: powershell
